# sensitive 日志插件统一使用本配置。
# 所有配置同时作用于 log4j2 与 logback。

# ================== 完整组件扩展（优先级最高） ==================
# 类必须是 public、具有 public 无参构造方法，并实现对应接口。
# 配置完整工厂后，下方 builtIn/custom 的同类工厂配置不再参与构建。
chars.scan.charsScanFactory.class=
chars.scan.charsReplaceFactory.class=
chars.scan.charsCore.class=
chars.scan.charsReplaceHash.class=
chars.scan.whiteListTrie.class=

# ================== 内置策略选择 ==================
# 数字标识仅用于选择 chars-scan 内置策略；自定义策略无需在这里重复声明标识。
chars.scan.builtIn.scanTypes=1,2,3,4,5,9
chars.scan.builtIn.replaceTypes=1,2,3,4,5,9
chars.scan.builtIn.defaultReplaceType=12

# ================== 单策略扩展 ==================
# 多个实现类用英文逗号分隔，策略标识自动取实现类的 getScanType()。
# 示例：
# chars.scan.custom.scans=com.example.MyPhoneScan,com.example.MyCustomScan
# chars.scan.custom.replaces=com.example.MyPhoneReplace,com.example.MyCustomReplace
chars.scan.custom.scans=
chars.scan.custom.replaces=

# true：自定义实现覆盖同标识的内置实现；false：同标识时内置实现优先。
# 新标识无论此项为何值都会被追加。
chars.scan.custom.override=true

# ================== CharsScanBs 其余扩展点 ==================
# defaults/common、concurrency、threadLocal
chars.scan.charsCore=defaults
chars.scan.charsCore.threadSize=10

# md5、none；showHash=false 时强制使用 none
chars.scan.charsReplaceHash=md5
chars.scan.showHash=true

# 与 chars-scan 默认值保持一致
chars.scan.prefixCharSet=:：,，'"‘“=| +-*/()（）【】[]{}><
chars.scan.escapePrefixCharSet=ntr
chars.scan.whiteList=
chars.scan.scanStartIndex=0

# 旧版 scanList、replaceList、defaultReplace、core、replaceHash、prefix，
# 以及 custom.scan.{标识}.class/custom.replace.{标识}.class 仍可兼容读取。
